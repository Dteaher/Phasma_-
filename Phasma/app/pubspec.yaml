name: tailtown
description: Город Хвостиков — мечты и первые финансовые решения.
publish_to: none
version: 0.16.0+16
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  hive_flutter: 1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/content.json
    - assets/art/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
